name: Deploy to GitHub Pages

on:
  push:
    branches:
      - settings-exploration-poc
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup npm registry
        run: |
          if [ -f .npmrc ]; then
            if [ -n "${{ secrets.FLEXPORT_NPM_TOKEN }}" ]; then
              echo "//artifactory.flexport.io/artifactory/api/npm/ffa-infra-npm-dev-local/:_authToken=${{ secrets.FLEXPORT_NPM_TOKEN }}" >> .npmrc
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /ux-proto-playground/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
